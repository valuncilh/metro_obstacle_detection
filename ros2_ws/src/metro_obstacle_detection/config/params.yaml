# Параметры пайплайна обнаружения препятствий

preprocessor:
  min_range: 1.0
  max_range: 300.0
  voxel_leaf_size: 0.15

gauge_filter:
  x_min: -2.0
  x_max: 300.0
  y_min: -1.5
  y_max: 1.5
  z_min: -0.5
  z_max: 4.0

anomaly_detector:
  cluster_tolerance: 0.5
  min_cluster_size: 15
  max_cluster_size: 50000
